  <text x="289" y="247" font-size="9.2" font-weight="500" fill="#74716B" text-anchor="start">Content decides.</text>
  <path d="M286 262 H374" stroke="#E1E0DA"/>
  <text class="plan-mono" x="289" y="285" font-size="9.2" fill="#77716A" text-anchor="start">03  ASSIGN SHELF</text>
  <text x="289" y="301" font-size="9.2" font-weight="500" fill="#74716B" text-anchor="start">One fixed category.</text>

  <rect x="284" y="332" width="98" height="56" rx="7" fill="#EEF1EB" stroke="#D5DAD1"/>
