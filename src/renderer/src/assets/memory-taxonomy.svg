  </g>

  <path d="M286 154 H374" stroke="#E1E0DA"/>
  <text class="plan-mono" x="289" y="177" font-size="9.2" fill="#77716A" text-anchor="start">01  KEEP SOURCE</text>
  <text x="289" y="193" font-size="9.2" font-weight="500" fill="#74716B" text-anchor="start">Source retained.</text>
  <path d="M286 208 H374" stroke="#E1E0DA"/>
