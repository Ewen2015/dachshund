<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="memory-plan-title memory-plan-desc" class="memory-plan-svg">
  <title id="memory-plan-title">How dachshund files memory</title>
  <desc id="memory-plan-desc">A top-down filing plan. Agent-native files enter a normalizer that resolves ten durable kinds and assigns each memory to one of four fixed categories. Evidence remains the only separate supporting layer.</desc>
  <defs>
    <pattern id="plan-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#D8D7D1"/>
    </pattern>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#171718" flood-opacity="0.055"/>
    </filter>
  </defs>
  <style>
    text {
      font-family: "Instrument Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
      font-variation-settings: "wdth" 100;
    }
    .plan-mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .plan-route {
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 3 4;
      opacity: 0.52;
    }
    .plan-route.is-source {
      stroke: #A6A39C;
    }
    .plan-route.is-aux {
      stroke: #9B9690;
    }
  </style>

  <rect width="900" height="500" fill="#F8F8F5"/>
  <rect width="900" height="500" fill="url(#plan-grid)" opacity="0.63"/>


    <g>
