<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-label="Anthropic Agent Memory 工作机制：四层记忆结构，在线写入、按需下钻、离线 dreaming 巩固与提升">
  <title>Agent Memory 的工作机制</title>
  <desc>四层记忆：会话日志、记忆笔记、知识表示（wiki 链接图）、注入上下文。在线会话写笔记与日志；会话启动时注入索引；需要时按需下钻读取；离线 dreaming 回放日志、纠错、维护 wiki 并把高层规则提升到注入层。</desc>

  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, "PingFang SC", monospace; }
    </style>

    <filter id="soft" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#20262C" flood-opacity="0.07"/>
    </filter>

    <marker id="a-amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C0762A"/>
    </marker>
    <marker id="a-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F7A67"/>
    </marker>
    <marker id="a-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8B9098"/>
    </marker>
  </defs>

  <rect width="1440" height="1050" fill="#FAF8F3"/>

  <!-- Title -->
  <text x="64" y="58" font-size="32" font-weight="700" fill="#20262C" letter-spacing="0.4">Agent Memory 的工作机制</text>
  <text x="64" y="90" font-size="16" fill="#6E747C">四层记忆 · 在线写入 / 按需下钻 / 离线 dreaming 巩固与提升</text>
  <text x="1376" y="56" text-anchor="end" font-size="11" fill="#8B9098">Anthropic · The components of agent memory</text>
  <text x="1376" y="74" text-anchor="end" font-size="11" fill="#8B9098">2026-11-06</text>

  <!-- ============ Session (online) ============ -->
  <g filter="url(#soft)">
    <rect x="340" y="124" width="720" height="86" rx="16" fill="#20262C"/>
  </g>
  <rect x="364" y="142" width="50" height="20" rx="10" fill="#C0762A"/>
  <text x="389" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1E22">在线</text>
  <text x="428" y="159" font-size="16" font-weight="700" fill="#FFFFFF">① 会话：行动 → 观察 → 结果</text>
  <text x="364" y="187" font-size="12.5" fill="#C4C9CF">判断什么值得记 → 写笔记；同时把完整过程追加到日志</text>
  <text x="1036" y="159" text-anchor="end" font-size="10.5" fill="#8C939B">context window</text>

  <!-- ============ Layer 1: injected context ============ -->
  <g filter="url(#soft)">
    <rect x="340" y="280" width="720" height="112" rx="14" fill="#FDF3E3" stroke="#E9D2AC"/>
  </g>
  <rect x="344" y="294" width="5" height="84" rx="2.5" fill="#C0762A"/>
  <text x="368" y="312" font-size="17" font-weight="700" fill="#7A4A16">注入上下文<tspan font-size="13.5" font-weight="500" fill="#A9793F">  Injected context</tspan></text>
  <text x="368" y="336" font-size="13" fill="#6B5537">新会话自动加载；只放索引与高层规则，必须小。</text>
  <text x="368" y="356" font-size="13" fill="#6B5537">细节下沉为链接，不占用常驻上下文。</text>
  <rect x="368" y="364" width="212" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.7" stroke="#E9D2AC"/>
  <text x="378" y="378" font-size="10.8" class="mono" fill="#8A541C">MEMORY.md · 前 200 行 / 25KB</text>

  <!-- index document doodle -->
  <rect x="896" y="300" width="106" height="72" rx="7" fill="#FFFDF8" stroke="#E3C79A"/>
  <line x1="908" y1="316" x2="984" y2="316" stroke="#D9B57E" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="908" y1="330" x2="970" y2="330" stroke="#D9B57E" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="908" y1="344" x2="978" y2="344" stroke="#C0762A" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="908" y1="358" x2="956" y2="358" stroke="#D9B57E" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="1006" y1="344" x2="1016" y2="344" stroke="#C0762A" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="1019" y="335" width="15" height="18" rx="3" fill="#FFFDF8" stroke="#C0762A" stroke-width="1.2"/>
  <line x1="1023" y1="341" x2="1030" y2="341" stroke="#C0762A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="1023" y1="346" x2="1028" y2="346" stroke="#C0762A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ============ Layer 2: wiki ============ -->
  <g filter="url(#soft)">
    <rect x="340" y="436" width="720" height="112" rx="14" fill="#E9F5F1" stroke="#BFDDD5"/>
  </g>
  <rect x="344" y="450" width="5" height="84" rx="2.5" fill="#1F7A67"/>
  <text x="368" y="468" font-size="17" font-weight="700" fill="#145E52">知识表示 · Wiki<tspan font-size="13.5" font-weight="500" fill="#4E8E82">  Linked pages</tspan></text>
  <text x="368" y="492" font-size="13" fill="#335A52">一页一主题；页面互链，形成可遍历的图。</text>
  <text x="368" y="512" font-size="13" fill="#335A52">由 dreaming 多轮增量写入、修改、合并、剪枝。</text>
  <rect x="368" y="520" width="230" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.7" stroke="#BFDDD5"/>
  <text x="378" y="534" font-size="10.8" class="mono" fill="#145E52">Markdown · 点 = 页面 · 线 = 链接</text>

  <!-- node-link doodle -->
  <g stroke="#1F7A67" stroke-opacity="0.45" stroke-width="1.6">
    <line x1="898" y1="472" x2="930" y2="460"/>
    <line x1="930" y1="460" x2="968" y2="468"/>
    <line x1="968" y1="468" x2="1000" y2="490"/>
    <line x1="1000" y1="490" x2="1006" y2="520"/>
    <line x1="1006" y1="520" x2="976" y2="534"/>
    <line x1="976" y1="534" x2="938" y2="536"/>
    <line x1="938" y1="536" x2="902" y2="514"/>
    <line x1="902" y1="514" x2="898" y2="472"/>
    <line x1="930" y1="460" x2="942" y2="494"/>
    <line x1="942" y1="494" x2="976" y2="534"/>
    <line x1="942" y1="494" x2="902" y2="514"/>
    <line x1="968" y1="468" x2="942" y2="494"/>
  </g>
  <circle cx="942" cy="494" r="11" fill="#1F7A67" fill-opacity="0.1"/>
  <g fill="#1F7A67">
    <circle cx="898" cy="472" r="4.2"/>
    <circle cx="930" cy="460" r="4.2"/>
    <circle cx="968" cy="468" r="4.2"/>
    <circle cx="1000" cy="490" r="4.2"/>
    <circle cx="1006" cy="520" r="4.2"/>
    <circle cx="976" cy="534" r="4.2"/>
    <circle cx="938" cy="536" r="4.2"/>
    <circle cx="902" cy="514" r="4.2"/>
    <circle cx="942" cy="494" r="5.2"/>
  </g>

  <!-- ============ Layer 3: memory notes ============ -->
  <g filter="url(#soft)">
    <rect x="340" y="592" width="720" height="112" rx="14" fill="#EBF1F9" stroke="#C7D7EC"/>
  </g>
  <rect x="344" y="606" width="5" height="84" rx="2.5" fill="#2F5E9E"/>
  <text x="368" y="624" font-size="17" font-weight="700" fill="#244A7C">记忆笔记<tspan font-size="13.5" font-weight="500" fill="#5B7BA8">  Memory notes</tspan></text>
  <text x="368" y="648" font-size="13" fill="#3A4F6B">会话中判断什么值得记：事实、规则、计划、踩坑。</text>
  <text x="368" y="668" font-size="13" fill="#3A4F6B">每条保留来源，供后续会话直接读取。</text>
  <rect x="368" y="676" width="190" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.75" stroke="#C7D7EC"/>
  <text x="378" y="690" font-size="10.8" class="mono" fill="#244A7C">memory/ · 一文件一主题</text>

  <!-- file cards doodle -->
  <rect x="892" y="612" width="54" height="78" rx="5" fill="#FCFDFF" stroke="#A9C3E2" transform="rotate(-7 919 651)"/>
  <rect x="948" y="612" width="54" height="78" rx="5" fill="#FCFDFF" stroke="#A9C3E2" transform="rotate(7 975 651)"/>
  <rect x="920" y="604" width="54" height="78" rx="5" fill="#FFFFFF" stroke="#7FA3CE"/>
  <line x1="930" y1="622" x2="964" y2="622" stroke="#7FA3CE" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="930" y1="634" x2="956" y2="634" stroke="#A9C3E2" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="930" y1="646" x2="962" y2="646" stroke="#A9C3E2" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="930" y1="658" x2="944" y2="658" stroke="#A9C3E2" stroke-width="2.4" stroke-linecap="round"/>

  <!-- ============ Layer 4: transcripts ============ -->
  <g filter="url(#soft)">
    <rect x="340" y="748" width="720" height="112" rx="14" fill="#F1F0EC" stroke="#D9D6CE"/>
  </g>
  <rect x="344" y="762" width="5" height="84" rx="2.5" fill="#5B5F66"/>
  <text x="368" y="780" font-size="17" font-weight="700" fill="#3F444B">会话日志<tspan font-size="13.5" font-weight="500" fill="#787E86">  Transcripts</tspan></text>
  <text x="368" y="804" font-size="13" fill="#4E545B">每轮动作、观察、结果的原始记录，不再改写。</text>
  <text x="368" y="824" font-size="13" fill="#4E545B">dreaming 用它作为 ground truth 校验记忆。</text>
  <rect x="368" y="832" width="212" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.75" stroke="#D9D6CE"/>
  <text x="378" y="846" font-size="10.8" class="mono" fill="#3F444B">session log · 不可变 · 全量</text>

  <!-- timeline doodle -->
  <rect x="908" y="784" width="18" height="5" rx="2.5" fill="#D8D5CB"/>
  <rect x="944" y="784" width="26" height="5" rx="2.5" fill="#D8D5CB"/>
  <rect x="984" y="784" width="20" height="5" rx="2.5" fill="#D8D5CB"/>
  <line x1="888" y1="804" x2="1020" y2="804" stroke="#A8A59C" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#C3C0B6" stroke-width="1.5">
    <line x1="896" y1="797" x2="896" y2="811"/>
    <line x1="916" y1="797" x2="916" y2="811"/>
    <line x1="936" y1="797" x2="936" y2="811"/>
    <line x1="956" y1="797" x2="956" y2="811"/>
    <line x1="976" y1="797" x2="976" y2="811"/>
    <line x1="996" y1="797" x2="996" y2="811"/>
    <line x1="1012" y1="797" x2="1012" y2="811"/>
  </g>
  <circle cx="916" cy="804" r="3.6" fill="#5B5F66"/>
  <circle cx="956" cy="804" r="3.6" fill="#5B5F66"/>
  <circle cx="996" cy="804" r="3.6" fill="#5B5F66"/>

  <!-- ============ 02 injection arrow ============ -->
  <path d="M700 278 V214" fill="none" stroke="#C0762A" stroke-width="2.2" marker-end="url(#a-amber)"/>
  <text x="718" y="242" font-size="12.5" font-weight="600" fill="#8A541C">② 新会话启动：注入索引</text>
  <text x="718" y="260" font-size="11.5" fill="#6E747C">只读 MEMORY.md 前 200 行 / 25KB</text>

  <!-- ============ Online write rail (03, 04) ============ -->
  <path d="M340 167 H290 V804 H334" fill="none" stroke="#C0762A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-amber)"/>
  <path d="M290 648 H334" fill="none" stroke="#C0762A" stroke-width="2" marker-end="url(#a-amber)"/>
  <text transform="rotate(-90 276 500)" x="276" y="500" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#C0762A" fill-opacity="0.85">在线写入</text>
  <text x="274" y="638" text-anchor="end" font-size="12.5" font-weight="600" fill="#8A541C">③ 判断显著性 → 写笔记</text>
  <text x="274" y="654" text-anchor="end" font-size="11.5" fill="#6E747C">在线完成，每轮都可写</text>
  <text x="274" y="790" text-anchor="end" font-size="12.5" font-weight="600" fill="#8A541C">④ 全量追加日志</text>
  <text x="274" y="806" text-anchor="end" font-size="11.5" fill="#6E747C">动作 / 观察 / 结果</text>

  <!-- ============ Read-down arrows ============ -->
  <path d="M700 396 V430" fill="none" stroke="#8B9098" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-gray)"/>
  <text x="724" y="410" font-size="12" font-weight="600" fill="#4F555C">调用：按需下钻，索引只给入口</text>
  <text x="724" y="426" font-size="11.5" fill="#6E747C">读页面、搜索、沿链接跳</text>

  <path d="M700 552 V586" fill="none" stroke="#8B9098" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-gray)"/>
  <text x="724" y="566" font-size="12" font-weight="600" fill="#4F555C">链接指向更细的笔记与来源</text>
  <text x="724" y="582" font-size="11.5" fill="#6E747C">wiki 是地图，不是全文</text>

  <path d="M700 708 V742" fill="none" stroke="#8B9098" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-gray)"/>
  <text x="724" y="722" font-size="12" font-weight="600" fill="#4F555C">需要时回查原始日志</text>
  <text x="724" y="738" font-size="11.5" fill="#6E747C">结论可被 ground truth 验证</text>

  <!-- ============ 05 playback into dreaming ============ -->
  <path d="M700 864 V896" fill="none" stroke="#8B9098" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-gray)"/>
  <text x="718" y="884" font-size="12" font-weight="600" fill="#4F555C">⑤ 回放日志（只读）</text>

  <!-- ============ Dreaming band ============ -->
  <g filter="url(#soft)">
    <rect x="340" y="900" width="720" height="84" rx="16" fill="#163B35"/>
  </g>
  <text x="364" y="928" font-size="16.5" font-weight="700" fill="#F2F7F5">Dreaming · 离线巩固</text>
  <text x="364" y="952" font-size="12.5" fill="#CBE3DC">⑥ 反思 → 对照来源验证 → 改写记忆</text>
  <text x="364" y="971" font-size="11" fill="#93BEB2">触发：会话间隙 / 空闲算力 · 可多轮、可并行，用共享 log 接力</text>
  <text x="1036" y="928" text-anchor="end" font-size="10.5" fill="#7FA99D">offline</text>

  <!-- ============ 07-09 write-back rail ============ -->
  <path d="M1060 942 H1100 V336 H1066" fill="none" stroke="#1F7A67" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-teal)"/>
  <path d="M1100 648 H1066" fill="none" stroke="#1F7A67" stroke-width="2" marker-end="url(#a-teal)"/>
  <path d="M1100 492 H1066" fill="none" stroke="#1F7A67" stroke-width="2" marker-end="url(#a-teal)"/>

  <text x="1116" y="640" font-size="12.5" font-weight="600" fill="#145E52">⑦ 纠错：对照日志改写</text>
  <text x="1116" y="656" font-size="11.5" fill="#6E747C">错误笔记不再被后续会话继承</text>

  <text x="1116" y="484" font-size="12.5" font-weight="600" fill="#145E52">⑧ 维护 wiki</text>
  <text x="1116" y="500" font-size="11.5" fill="#6E747C">建链 / 合并 / 补页 / 剪枝</text>

  <text x="1116" y="328" font-size="12.5" font-weight="600" fill="#145E52">⑨ 提升到注入层</text>
  <text x="1116" y="344" font-size="11.5" fill="#6E747C">高层规则上浮，细节下沉</text>

  <!-- ============ Legend ============ -->
  <rect x="64" y="872" width="214" height="112" rx="12" fill="#FFFFFF" stroke="#E4DFD4"/>
  <text x="84" y="896" font-size="11" font-weight="700" fill="#6E747C" letter-spacing="1">图例</text>
  <line x1="84" y1="916" x2="124" y2="916" stroke="#C0762A" stroke-width="2"/>
  <text x="134" y="920" font-size="10.8" fill="#4F555C">在线：注入 / 写笔记 / 日志</text>
  <line x1="84" y1="940" x2="124" y2="940" stroke="#1F7A67" stroke-width="2"/>
  <text x="134" y="944" font-size="10.8" fill="#4F555C">dreaming：离线巩固写回</text>
  <line x1="84" y1="964" x2="124" y2="964" stroke="#8B9098" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="134" y="968" font-size="10.8" fill="#4F555C">按需读取 / 下钻</text>

  <!-- ============ Footer ============ -->
  <text x="340" y="1016" font-size="11.5" fill="#6E747C">原文没有用图数据库：「图」是 wiki 页面之间的链接图 —— 点 = Markdown 页面，线 = 正文里的链接。</text>
  <text x="340" y="1034" font-size="11.5" fill="#6E747C">调用方式 = 启动时注入索引 + 按需 search / 读文件 / 沿链接遍历；dreaming 在离线时维护这张图和顶层索引。</text>
</svg>
